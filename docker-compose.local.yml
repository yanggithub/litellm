services:
  postgresdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5432:5432"
    volumes:
      - litellm_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 2s
      timeout: 5s
      retries: 20

  litellm:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        LITELLM_BUILD_IMAGE: ${LITELLM_BUILD_IMAGE:-cgr.dev/chainguard/wolfi-base:latest}
        LITELLM_RUNTIME_IMAGE: ${LITELLM_RUNTIME_IMAGE:-cgr.dev/chainguard/wolfi-base:latest}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.7}
    image: ${LITELLM_DOCKER_IMAGE:-litellm-codex-minimax:local-arm64-native}
    platform: ${LITELLM_DOCKER_PLATFORM:-linux/arm64/v8}
    restart: unless-stopped
    depends_on:
      postgresdb:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./custom_config.yaml:/app/custom_config.yaml:ro
      - ${CHATGPT_TOKEN_DIR:-${HOME}/.config/litellm/chatgpt}:/root/.config/litellm/chatgpt
    tmpfs:
      - /tmp/litellm-ui
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@postgresdb:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-litellm-local}"
      CHATGPT_TOKEN_DIR: "/root/.config/litellm/chatgpt"
      LITELLM_UI_PATH: "/tmp/litellm-ui"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
    command:
      - "--config=/app/custom_config.yaml"
      - "--port=4000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  litellm_local_postgres_data:
    name: litellm_local_postgres_data
